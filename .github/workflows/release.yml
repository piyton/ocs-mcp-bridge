# Build the plugin for every platform and attach the assets the Open CAD
# Studio Plugin Manager expects (windows-x86_64.dll etc. + plugin.toml) to the
# release for the pushed tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            lib: ocs_mcp_bridge.dll
            asset: windows-x86_64.dll
          - os: ubuntu-latest
            lib: libocs_mcp_bridge.so
            asset: linux-x86_64.so
          - os: macos-latest
            lib: libocs_mcp_bridge.dylib
            asset: macos-aarch64.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Rename to the Plugin Manager asset name
        shell: bash
        run: cp "target/release/${{ matrix.lib }}" "${{ matrix.asset }}"
      # From API v5 the host refuses a plugin that does not declare the
      # toolchain it was built with. Stamp it from the compiler that actually
      # ran, so the manifest cannot drift from the binary.
      - name: Stamp rustc_version into plugin.toml
        shell: bash
        run: |
          RUSTC="$(rustc --version)"
          sed -i.bak "s|^rustc_version = .*|rustc_version = \"$RUSTC\"|" plugin.toml
          rm -f plugin.toml.bak
          grep rustc_version plugin.toml
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            plugin.toml
