[package]
name = "ocs-mcp-bridge"
version = "0.8.0"
edition = "2021"
description = "Open CAD Studio plugin that serves the live selection and accepts draw/remove requests over a local socket, so MCP servers and other tools can read and write the open drawing."
license = "GPL-3.0-only"
repository = "https://github.com/piyton/ocs-mcp-bridge"

[lib]
crate-type = ["cdylib"]

# Pin to the release tag the installed host was built from, so the loaded
# library is binary-compatible with it.
[dependencies]
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", tag = "v0.9.8", features = ["host"] }
acadrust = { git = "https://github.com/HakanSeven12/cadcodec.git", rev = "788eea0161ba9f3eb7ee6569fd8bb52a8207a2ed", features = ["serde"] }
serde_json = "1"

# `ocs_plugin_api` asks for acadrust rev 5b2ae66 while the host workspace pins
# 788eea0, and the host reconciles that with exactly this patch. Mirror it or
# cargo builds both revisions, and the two sets of `EntityType` / `Handle`
# types do not interchange - which is a wall of E0308 mismatches.
[patch."https://github.com/HakanSeven12/cadcodec.git"]
acadrust = { git = "https://git@github.com/HakanSeven12/cadcodec.git", rev = "788eea0161ba9f3eb7ee6569fd8bb52a8207a2ed" }
